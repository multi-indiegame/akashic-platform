<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Akashic Platform API Docs</title>
    <link rel="stylesheet" href="./swagger-ui.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #swagger-ui {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="./swagger-ui-bundle.js"></script>
    <script src="./swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = () => {
        SwaggerUIBundle({
          dom_id: "#swagger-ui",
          urls: [
            {
              name: "external-api",
              url: "./external-api.openapi.json",
            },
            {
              name: "akashic-server",
              url: "./akashic-server.openapi.json",
            },
            {
              name: "akashic-runner",
              url: "./akashic-runner.openapi.json",
            },
            {
              name: "akashic-storage",
              url: "./akashic-storage-public.openapi.json",
            },
            {
              name: "akashic-storage-admin",
              url: "./akashic-storage-admin.openapi.json",
            },
            {
              name: "manager-server",
              url: "./manager-server.openapi.json",
            },
          ],
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout",
          supportedSubmitMethods: [],
        });
      };
    </script>
  </body>
</html>
