name: Deploy Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false
        description: Push images even if the version is already pushed

permissions:
  id-token: write
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: set-matrix
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          cat > "$RUNNER_TEMP/services.json" <<'EOF'
          [
            {"name":"db-migrate","workspace":"schema/persist","context":".","dockerfile":"schema/persist/Dockerfile"},
            {"name":"akashic-storage","workspace":"akashic-storage","context":".","dockerfile":"akashic-storage/Dockerfile"},
            {"name":"akashic-server","workspace":"akashic-server","context":".","dockerfile":"akashic-server/Dockerfile"},
            {"name":"akashic-runner","workspace":"akashic-runner","context":".","dockerfile":"akashic-runner/Dockerfile"},
            {"name":"webapp","workspace":"webapp","context":".","dockerfile":"webapp/Dockerfile"},
            {"name":"manager-server","workspace":"manager-server","context":".","dockerfile":"manager-server/Dockerfile"}
          ]
          EOF
          targets='[]'
          while read -r service; do
            name="$(jq -r '.name' <<< "$service")"
            workspace="$(jq -r '.workspace' <<< "$service")"
            version="$(node -p "require('./$workspace/package.json').version")"
            if [ "$FORCE" != "true" ] \
              && aws ecr describe-images \
                --repository-name "multi-indiegame/$name" \
                --image-ids "imageTag=$version" > /dev/null 2>&1; then
              echo "skip $name: $version is already pushed"
              continue
            fi
            echo "build $name: $version"
            targets="$(jq -c --argjson service "$service" --arg version "$version" '. + [$service + {"version": $version}]' <<< "$targets")"
          done < <(jq -c '.[]' "$RUNNER_TEMP/services.json")
          echo "matrix={\"service\":$targets}" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<< "$targets")" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Cert file
        run: printf '%s' "${{ secrets.POSTGRES_CERT }}" > postgres.pem

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Login to Docker Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.login-ecr.outputs.registry }}

      - name: Build and push "${{ matrix.service.name }}"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/multi-indiegame/${{ matrix.service.name }}:${{ matrix.service.version }}
            ${{ steps.login-ecr.outputs.registry }}/multi-indiegame/${{ matrix.service.name }}:latest
          push: true
